[project]
name = "personal-assistant"
version = "0.1.0"
description = "A modular, local-first personal AI assistant built with Python, LangGraph and Ollama, starting with read-only Gmail search."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.202.0",
    "google-auth-httplib2>=0.4.4",
    "google-auth-oauthlib>=1.5.0",
    "langchain-ollama>=1.1.0",
    "pydantic-settings>=2.16.2",
]

[project.scripts]
personal-assistant = "personal_assistant:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["personal_assistant.gmail.*"]
disallow_untyped_calls = false